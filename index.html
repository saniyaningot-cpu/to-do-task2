<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker | To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 p-4">
          <h3 class="fw-bold text-center mb-1 text-dark">Task Tracker</h3>
          <p class="text-center text-muted small mb-4">Interactive To-Do List App</p>

          <!-- Input Box -->
          <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control py-2" placeholder="Add a new task..." />
            <button id="addBtn" class="btn btn-warning fw-semibold px-4">
              <i class="bi bi-plus-lg me-1"></i> Add
            </button>
          </div>

          <!-- Filter / Status Summary -->
          <div class="d-flex justify-content-between align-items-center mb-3 px-1">
            <span id="taskCount" class="text-muted small fw-semibold">0 tasks pending</span>
            <button id="clearAllBtn" class="btn btn-link text-danger text-decoration-none p-0 small">Clear Completed</button>
          </div>

          <!-- Task List Container -->
          <ul id="taskList" class="list-group list-group-flush"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
